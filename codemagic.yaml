workflows:
  android-workflow:
    name: Fan Cooler Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate scaffold Flutter (folder android/) kalau belum ada
        script: |
          if [ ! -d "android" ]; then
            echo "Scaffold android/ belum ada, generate otomatis pakai flutter create..."
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            cp -r lib /tmp/lib.bak
            flutter create --platforms=android --org com.coolerapp --project-name app_controller .
            cp /tmp/pubspec.yaml.bak pubspec.yaml
            rm -rf lib
            cp -r /tmp/lib.bak lib
          else
            echo "Folder android/ sudah ada, skip generate."
          fi
      - name: Pasang konfigurasi Firebase (google-services.json)
        script: |
          if [ ! -f "firebase/google-services.json" ]; then
            echo "!!! firebase/google-services.json tidak ditemukan di repo."
            echo "!!! Download dari Firebase Console > Project settings > Your apps > Android,"
            echo "!!! lalu commit ke path firebase/google-services.json (lihat README.md)."
            exit 1
          fi
          cp firebase/google-services.json android/app/google-services.json

          # Patch file-file Gradle & Manifest pakai Python -- supaya perilakunya
          # SAMA PERSIS baik di mesin build Linux maupun macOS (sed versi BSD di
          # macOS beda sintaks dari GNU sed di Linux dan sering bikin build gagal).
          python3 << 'PYEOF'
          import re, os

          def patch(path, pattern, replacement, marker, flags=0):
              if not os.path.isfile(path):
                  return
              with open(path, "r") as f:
                  content = f.read()
              if marker in content:
                  print(f"skip (sudah ada): {path}")
                  return
              new_content, n = re.subn(pattern, replacement, content, count=1, flags=flags)
              if n == 0:
                  print(f"!!! pola tidak ketemu di {path}, skip patch ini.")
                  return
              with open(path, "w") as f:
                  f.write(new_content)
              print(f"patched: {path}")

          # --- android/settings.gradle.kts: daftarkan versi plugin Google Services ---
          # Template Flutter modern tidak lagi pakai buildscript/classpath di
          # android/build.gradle.kts -- resolusi plugin dilakukan lewat blok
          # `plugins {}` di settings.gradle.kts. Kalau versi plugin tidak
          # didaftarkan di sana, `id("com.google.gms.google-services")` di
          # app/build.gradle.kts tidak akan ketemu sumbernya (persis error di atas).
          patch(
              "android/settings.gradle.kts",
              r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+" apply false',
              lambda m: m.group(0) + '\n    id("com.google.gms.google-services") version "4.4.2" apply false',
              "com.google.gms.google-services",
          )
          patch(
              "android/settings.gradle",
              r"id\s+'org\.jetbrains\.kotlin\.android'\s+version\s+'[^']+'\s+apply\s+false",
              lambda m: m.group(0) + "\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
              "com.google.gms.google-services",
          )

          # --- android/app/build.gradle(.kts): apply plugin Google Services ---
          patch(
              "android/app/build.gradle.kts",
              r"plugins\s*\{",
              'plugins {\n    id("com.google.gms.google-services")',
              "com.google.gms.google-services",
          )
          patch(
              "android/app/build.gradle",
              r"plugins\s*\{",
              "plugins {\n    id 'com.google.gms.google-services'",
              "com.google.gms.google-services",
          )

          # --- AndroidManifest.xml: izin QUERY_ALL_PACKAGES (daftar app terinstall) ---
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.isfile(manifest):
              with open(manifest, "r") as f:
                  content = f.read()
              if "QUERY_ALL_PACKAGES" not in content:
                  if 'xmlns:tools=' not in content:
                      content = content.replace(
                          "<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1
                      )
                  content = content.replace(
                      "<application",
                      '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" '
                      'tools:ignore="QueryAllPackagesPermission"/>\n\n    <application',
                      1,
                  )
                  with open(manifest, "w") as f:
                      f.write(content)
                  print(f"patched: {manifest}")
              else:
                  print(f"skip (sudah ada): {manifest}")
          PYEOF
      - name: Ambil dependency Flutter
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt

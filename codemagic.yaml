workflows:
  android-workflow:
    name: Fan Cooler Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate scaffold Flutter (folder android/) kalau belum ada
        script: |
          if [ ! -d "android" ]; then
            echo "Scaffold android/ belum ada, generate otomatis pakai flutter create..."
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            cp -r lib /tmp/lib.bak
            flutter create --platforms=android --org com.coolerapp --project-name app_controller .
            cp /tmp/pubspec.yaml.bak pubspec.yaml
            rm -rf lib
            cp -r /tmp/lib.bak lib
          else
            echo "Folder android/ sudah ada, skip generate."
          fi
      - name: Pasang konfigurasi Firebase (google-services.json)
        script: |
          if [ ! -f "firebase/google-services.json" ]; then
            echo "!!! firebase/google-services.json tidak ditemukan di repo."
            echo "!!! Download dari Firebase Console > Project settings > Your apps > Android,"
            echo "!!! lalu commit ke path firebase/google-services.json (lihat README.md)."
            exit 1
          fi
          cp firebase/google-services.json android/app/google-services.json

          # --- Patch android/build.gradle(.kts): tambahkan classpath Google Services plugin ---
          if [ -f "android/build.gradle.kts" ]; then
            GFILE="android/build.gradle.kts"
            grep -q "com.google.gms:google-services" "$GFILE" || \
              sed -i 's/dependencies {/dependencies {\n        classpath("com.google.gms:google-services:4.4.2")/' "$GFILE"
          elif [ -f "android/build.gradle" ]; then
            GFILE="android/build.gradle"
            grep -q "com.google.gms:google-services" "$GFILE" || \
              sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" "$GFILE"
          fi

          # --- Patch android/app/build.gradle(.kts): apply plugin Google Services ---
          if [ -f "android/app/build.gradle.kts" ]; then
            AFILE="android/app/build.gradle.kts"
            grep -q "com.google.gms.google-services" "$AFILE" || \
              sed -i '0,/^plugins {/s//plugins {\n    id("com.google.gms.google-services")/' "$AFILE"
          elif [ -f "android/app/build.gradle" ]; then
            AFILE="android/app/build.gradle"
            grep -q "com.google.gms.google-services" "$AFILE" || \
              echo "apply plugin: 'com.google.gms.google-services'" >> "$AFILE"
          fi

          # --- Izin QUERY_ALL_PACKAGES (fitur daftar aplikasi terinstall) ---
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "QUERY_ALL_PACKAGES" "$MANIFEST"; then
            sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission"/>\n\n    <application#' "$MANIFEST"
          fi
      - name: Ambil dependency Flutter
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
